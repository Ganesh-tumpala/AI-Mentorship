name: Evaluate Classifier

on: [push]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install scikit-learn numpy
      - run: python eval.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
